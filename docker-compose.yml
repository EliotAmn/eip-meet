services:
  app:
    build: .
    ports:
      - '3000:3000'
    # AUTH_* variables (secret, Google / Microsoft credentials, AUTH_URL).
    env_file:
      - path: .env
        required: false
    environment:
      # Takes precedence over the .env value: the DB lives on the volume.
      - DATABASE_URL=file:/data/prod.db
    volumes:
      # Volume name kept from the app's former name (LogiMeet) on purpose:
      # renaming it would start from an empty database.
      - logimeet-data:/data
    restart: unless-stopped

volumes:
  logimeet-data:
